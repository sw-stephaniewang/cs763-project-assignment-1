# AI contribution: Generated with GitHub Copilot; estimated AI contribution: 90%.
# Human review: Reviewed by Stephanie Wang.

name: CS763 Assignment 1 DevSecOps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Tests and Security Scans
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Initialize report directory and run metadata
        run: |
          mkdir -p reports
          {
            printf 'Workflow: %s\n' "$GITHUB_WORKFLOW"
            printf 'Event: %s\n' "$GITHUB_EVENT_NAME"
            printf 'Commit: %s\n' "$GITHUB_SHA"
            python --version
            docker compose version
          } | tee reports/run-metadata.txt

      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt 2>&1 | tee reports/dependency-install.log

      - name: Run pytest
        run: python -m pytest -q 2>&1 | tee reports/pytest.log

      - name: Validate Compose configuration
        run: docker compose config > reports/compose-config.yaml

      - name: Build Docker image for scanning
        run: docker build --tag "cs763-a1-ci:${GITHUB_SHA}" . 2>&1 | tee reports/docker-build.log

      - name: Scan image with Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: cs763-a1-ci:${{ github.sha }}
          format: json
          output: reports/trivy.json
          exit-code: "0"
          vuln-type: library
          scanners: vuln

      - name: Install Semgrep in an isolated temporary environment
        id: semgrep_install
        run: |
          python -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install --upgrade pip semgrep 2>&1 | tee reports/semgrep-install.log

      - name: Scan source with Semgrep
        id: semgrep
        if: ${{ always() && steps.semgrep_install.outcome == 'success' }}
        continue-on-error: true
        run: >-
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan
          --config p/python
          --metrics off
          --json-output reports/semgrep.json
          --no-error
          . 2>&1 | tee reports/semgrep.log

      - name: Validate SonarQube configuration
        id: sonar_config
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::SonarQube is configured but SONAR_TOKEN is missing. Add it as a GitHub Actions secret."
            exit 1
          fi
          if [[ -z "$SONAR_PROJECT_KEY" ]]; then
            echo "::error::SONAR_PROJECT_KEY is missing. Set the project key as a GitHub Actions variable."
            exit 1
          fi
          if [[ -n "$SONAR_ORGANIZATION" ]]; then
            echo "platform=cloud" >> "$GITHUB_OUTPUT"
            echo "SonarQube target: Cloud" | tee reports/sonar-configuration.txt
          elif [[ -n "$SONAR_HOST_URL" ]]; then
            echo "platform=server" >> "$GITHUB_OUTPUT"
            echo "SonarQube target: Server" | tee reports/sonar-configuration.txt
          else
            echo "::error::Choose SonarQube Cloud (set SONAR_ORGANIZATION) or Server (set SONAR_HOST_URL)."
            exit 1
          fi

      - name: Scan with SonarQube Cloud
        id: sonar_cloud
        if: ${{ steps.sonar_config.outputs.platform == 'cloud' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=main.py
            -Dsonar.tests=tests
            -Dsonar.python.version=3.13

      - name: Scan with SonarQube Server
        id: sonar_server
        if: ${{ steps.sonar_config.outputs.platform == 'server' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=main.py
            -Dsonar.tests=tests
            -Dsonar.python.version=3.13

      - name: Wait for SonarQube background processing
        id: sonar_processing
        if: ${{ always() && (steps.sonar_cloud.outcome == 'success' || steps.sonar_server.outcome == 'success') }}
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen

          output_path = Path("reports/sonar-processing-result.json")
          report_task_path = Path(".scannerwork/report-task.txt")
          timeout_seconds = 600
          poll_interval_seconds = 5
          evidence = {"status": "ERROR", "pollCount": 0}

          def save_evidence():
              output_path.write_text(json.dumps(evidence, indent=2) + "\n")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"status={evidence['status']}\n")

          try:
              if not report_task_path.is_file():
                  raise RuntimeError("SonarScanner did not create .scannerwork/report-task.txt")

              report_task = {}
              for line in report_task_path.read_text().splitlines():
                  key, separator, value = line.partition("=")
                  if separator:
                      report_task[key] = value

              task_url = report_task.get("ceTaskUrl", "")
              task_id = report_task.get("ceTaskId", "")
              if not task_url:
                  raise RuntimeError("SonarScanner report-task.txt is missing ceTaskUrl")

              task_host = urlparse(task_url).netloc
              configured_host = urlparse(os.environ["SONAR_HOST_URL"]).netloc
              if not task_host or task_host != configured_host:
                  raise RuntimeError("Sonar Compute Engine task URL host does not match the configured SonarQube host")

              evidence.update({"taskId": task_id, "taskUrl": task_url})
              started_at = time.monotonic()
              deadline = started_at + timeout_seconds

              while True:
                  request = Request(
                      task_url,
                      headers={"Authorization": f"Bearer {os.environ['SONAR_TOKEN']}"},
                  )
                  with urlopen(request, timeout=30) as response:
                      payload = json.load(response)

                  task = payload.get("task")
                  if not isinstance(task, dict) or not isinstance(task.get("status"), str):
                      raise RuntimeError("Sonar Compute Engine response is missing task.status")

                  status = task["status"]
                  evidence.update({
                      "status": status,
                      "computeEngineTask": task,
                      "pollCount": evidence["pollCount"] + 1,
                      "elapsedSeconds": round(time.monotonic() - started_at, 1),
                  })

                  if status == "SUCCESS":
                      save_evidence()
                      print(f"SonarQube background processing completed: {status}")
                      break
                  if status in {"FAILED", "CANCELED"}:
                      save_evidence()
                      print(f"SonarQube background processing ended with {status}: {task.get('errorMessage', 'no error message returned')}")
                      sys.exit(1)
                  if status not in {"PENDING", "IN_PROGRESS"}:
                      raise RuntimeError(f"Unexpected Sonar Compute Engine task status: {status}")
                  if time.monotonic() >= deadline:
                      evidence.update({
                          "status": "TIMEOUT",
                          "lastComputeEngineStatus": status,
                          "timeoutSeconds": timeout_seconds,
                      })
                      save_evidence()
                      print(f"SonarQube background processing timed out after {timeout_seconds} seconds; last status: {status}")
                      sys.exit(1)

                  time.sleep(poll_interval_seconds)
          except (HTTPError, URLError, OSError, ValueError, RuntimeError) as error:
              evidence.update({"status": "API_ERROR", "error": str(error)})
              save_evidence()
              print(f"SonarQube background processing could not be verified: {error}")
              sys.exit(1)
          PY

      - name: Summarize findings and scanner execution
        id: scanner_summary
        if: always()
        continue-on-error: true
        env:
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          SEMGREP_INSTALL_OUTCOME: ${{ steps.semgrep_install.outcome }}
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          SONAR_CONFIG_OUTCOME: ${{ steps.sonar_config.outcome }}
          SONAR_PLATFORM: ${{ steps.sonar_config.outputs.platform }}
          SONAR_CLOUD_OUTCOME: ${{ steps.sonar_cloud.outcome }}
          SONAR_SERVER_OUTCOME: ${{ steps.sonar_server.outcome }}
          SONAR_PROCESSING_OUTCOME: ${{ steps.sonar_processing.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_dir = Path("reports")
          errors = []
          lines = ["# Security scan summary", "", "Findings are reported for review; they do not fail this workflow." , ""]

          trivy_outcome = os.environ.get("TRIVY_OUTCOME", "unknown")
          lines.append(f"- Trivy execution: {trivy_outcome}")
          trivy_path = report_dir / "trivy.json"
          if trivy_outcome == "success":
              try:
                  trivy_report = json.loads(trivy_path.read_text())
                  counts = {severity: 0 for severity in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN")}
                  for result in trivy_report.get("Results") or []:
                      for vulnerability in result.get("Vulnerabilities") or []:
                          severity = vulnerability.get("Severity", "UNKNOWN").upper()
                          counts[severity] = counts.get(severity, 0) + 1
                  lines.append("- Trivy library vulnerability findings: " + ", ".join(f"{key}={value}" for key, value in counts.items()))
              except (OSError, json.JSONDecodeError, AttributeError) as error:
                  errors.append(f"Trivy report unavailable or invalid: {error}")
          else:
              errors.append(f"Trivy scanner execution was {trivy_outcome}.")

          semgrep_install = os.environ.get("SEMGREP_INSTALL_OUTCOME", "unknown")
          semgrep_outcome = os.environ.get("SEMGREP_OUTCOME", "unknown")
          lines.append(f"- Semgrep installation: {semgrep_install}")
          lines.append(f"- Semgrep execution: {semgrep_outcome}")
          if semgrep_install != "success":
              errors.append(f"Semgrep installation was {semgrep_install}.")
          else:
              try:
                  semgrep_report = json.loads((report_dir / "semgrep.json").read_text())
                  lines.append(f"- Semgrep findings: {len(semgrep_report.get('results', []))}")
                  if "errors" not in semgrep_report or not isinstance(semgrep_report["errors"], list):
                      errors.append("Semgrep report is missing a valid 'errors' array; scan completeness cannot be determined.")
                  else:
                      semgrep_errors = semgrep_report["errors"]
                      lines.append(f"- Semgrep analysis errors: {len(semgrep_errors)}")
                      if semgrep_errors:
                          errors.append(f"Semgrep reported {len(semgrep_errors)} scanner or analysis error(s); results may be incomplete.")
                          for semgrep_error in semgrep_errors:
                              details = {
                                  key: semgrep_error.get(key)
                                  for key in ("level", "type", "code", "message", "path", "rule_id")
                                  if semgrep_error.get(key) is not None
                              } if isinstance(semgrep_error, dict) else {"error": semgrep_error}
                              lines.append("  - Semgrep error: " + json.dumps(details, ensure_ascii=True))
              except (OSError, json.JSONDecodeError, AttributeError) as error:
                  errors.append(f"Semgrep report unavailable or invalid: {error}")
              if semgrep_outcome != "success":
                  errors.append(f"Semgrep scanner execution was {semgrep_outcome}.")

          sonar_config = os.environ.get("SONAR_CONFIG_OUTCOME", "unknown")
          sonar_platform = os.environ.get("SONAR_PLATFORM", "")
          lines.append(f"- SonarQube configuration: {sonar_config}")
          if sonar_config != "success":
              errors.append("SonarQube is not configured or its configuration check failed; see the workflow log and configure the required GitHub secret/variables.")
          else:
              sonar_outcome = os.environ.get(f"SONAR_{sonar_platform.upper()}_OUTCOME", "unknown")
              lines.append(f"- SonarQube {sonar_platform} execution: {sonar_outcome}")
              if sonar_outcome != "success":
                  errors.append(f"SonarQube {sonar_platform} scanner execution was {sonar_outcome}.")
              else:
                  processing_outcome = os.environ.get("SONAR_PROCESSING_OUTCOME", "unknown")
                  lines.append(f"- SonarQube background processing execution: {processing_outcome}")
                  processing_report = report_dir / "sonar-processing-result.json"
                  if processing_outcome != "success":
                      errors.append(f"SonarQube background processing failed or timed out (step outcome: {processing_outcome}).")
                  elif processing_report.is_file():
                      try:
                          processing_result = json.loads(processing_report.read_text())
                          processing_status = processing_result.get("status", "unknown")
                          lines.append(f"- SonarQube background processing status: {processing_status}")
                          if processing_status != "SUCCESS":
                              errors.append(f"SonarQube background processing did not complete successfully: {processing_result.get('error', processing_result.get('computeEngineTask', {}).get('errorMessage', processing_status))}")
                      except (OSError, json.JSONDecodeError, AttributeError) as error:
                          errors.append(f"SonarQube processing evidence is unavailable or invalid: {error}")
                  else:
                      errors.append("SonarQube processing evidence was not produced.")
          lines.append("")
          lines.append("SonarQube analysis details and findings are available in the configured SonarQube project.")
          if errors:
              lines.extend(["", "## Execution failures", *[f"- {error}" for error in errors]])
          else:
              lines.extend(["", "Scanner execution and report generation completed successfully."])

          summary = "\n".join(lines) + "\n"
          (report_dir / "security-summary.md").write_text(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as step_summary:
              step_summary.write(summary)
          print(summary)
          if errors:
              raise SystemExit(1)
          PY

      - name: Upload scanner reports and execution evidence
        id: upload_reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cs763-a1-security-reports
          path: reports/
          if-no-files-found: error
          retention-days: 14

      - name: Fail only for scanner execution or artifact errors
        if: always()
        env:
          SUMMARY_OUTCOME: ${{ steps.scanner_summary.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_reports.outcome }}
        run: |
          if [[ "$SUMMARY_OUTCOME" != "success" ]]; then
            echo "::error::At least one security scanner failed to execute or produce a report. See the security summary artifact."
            exit 1
          fi
          if [[ "$ARTIFACT_OUTCOME" != "success" ]]; then
            echo "::error::Scanner reports or execution evidence could not be uploaded."
            exit 1
          fi
